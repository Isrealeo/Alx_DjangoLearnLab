<!DOCTYPE html>
<html>
<head><title>Books</title></head>
<body>
<h2>All Books</h2>
<ul>
  {% for book in books %}
    <li>{{ book.title }} by {{ book.author.name }}
      <a href="{% url 'edit_book' book.pk %}">Edit</a>
      <a href="{% url 'delete_book' book.pk %}">Delete</a>
    </li>
  {% endfor %}
</ul>
<a href="{% url 'add_book' %}">Add New Book</a>
</body>
</html>
